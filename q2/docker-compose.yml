
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: negarabank
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${DATASET_DIR}:/data:ro
      - ../scripts:/scripts:ro
      - .:/sql:ro
      - ./docker/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d negarabank && psql -U postgres -d negarabank -tc \"select to_regclass('gold.v_fraud_alerts')\" | grep -q v_fraud"]
      interval: 10s
      retries: 60
      start_period: 20s

  dbt:
    profiles: ["dbt"]
    build:
      context: .
      dockerfile: docker/Dockerfile.dbt
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: negarabank
    volumes: ["./dbt:/usr/app"]
    depends_on:
      postgres: {condition: service_healthy}

  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports: ["5050:80"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  pgadmin_data:
